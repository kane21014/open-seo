name: Deploy JLK OpenSEO
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: jlk-selfhost
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'kane21014/open-seo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.JLK_CLOUDFLARE_API_TOKEN }}
          DATAFORSEO_API_KEY: ${{ secrets.JLK_DATAFORSEO_API_KEY }}
        run: |
          set -eu
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing Cloudflare account ID}"
          : "${CLOUDFLARE_API_TOKEN:?Missing Cloudflare token}"
          : "${DATAFORSEO_API_KEY:?Missing DataForSEO key}"
          umask 077
          trap 'rm -f .env.selfhost' EXIT
          printf 'AUTH_MODE=password\nDATAFORSEO_API_KEY=%s\n' "$DATAFORSEO_API_KEY" > .env.selfhost
          node scripts/selfhost-deploy-preflight.mjs
          pnpm alchemy cloudflare bootstrap
          pnpm deploy:selfhost --yes
